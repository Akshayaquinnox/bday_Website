<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }

        .image-container {
            position: relative;      /* allows overlay */
            width: 100vw;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
 .overlay {
            position: absolute;
            bottom: 30px;            /* pushes overlay slightly up from bottom */
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 8px black; /* readable on any background */
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .yes-btn {
            background-color: #4CAF50;
            color: white;
        }

        .no-btn {
            background-color: #f44336;
            color: white;
        }olor: white;
        }
    </style>
</head>
<body>
     <div class="image-container">
        <img src="index.png" alt="My Image">

        <div class="overlay">
            Are you excited for your Big Day? <br><br>
            <button class="yes-btn" onclick="location.href='pop_balloon.html'">Yes</button>
            <button class="no-btn" onclick="location.href='no.html'">No</button>
        </div>
    </div>
</body>
</html>
