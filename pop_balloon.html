<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop the Balloons!</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            font-family: Arial, sans-serif;
        }

        /* Background image */
        body {
            background-image: url("2.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        /* Center content */
        .content {
            margin-top: 80px;
            text-shadow: 2px 2px 8px black;
        }

        button {
            font: inherit;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

       .balloon-section {
    margin-top: 60px;
    text-align: center;
    color: white;
    text-shadow: 2px 2px 8px black;
}


.title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 30px;
}

.balloon-field {
    position: relative;
    height: 420px;
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    padding: 20px 0;
}

.balloon {
    position: relative;
    width: 80px;
    height: 100px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: transform 0.25s ease, opacity 0.25s ease;
    box-shadow: inset 0 -12px 20px rgba(0,0,0,0.15);
    animation: floatBalloon 3.8s ease-in-out infinite;
    margin: 8px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 8px black;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

/* Cartoon shine */
.balloon::before {
    content: "";
    position: absolute;
    top: 25px;
    left: 25px;
    width: 30px;
    height: 40px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    transform: rotate(-20deg);
}

/* Balloon string */
.balloon::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -18px;
    width: 2px;
    height: 20px;
    background: rgba(255,255,255,0.7);
    transform: translateX(-50%);
}

/* Cartoon gradient colors */
.balloon[data-color="pink"] { background: linear-gradient(145deg, #ff8acb, #ff4fa3); }
.balloon[data-color="blue"] { background: linear-gradient(145deg, #6ec6ff, #1e90ff); }
.balloon[data-color="yellow"] { background: linear-gradient(145deg, #fff176, #ffd700); }
.balloon[data-color="purple"] { background: linear-gradient(145deg, #b388ff, #9370db); }
.balloon[data-color="green"] { background: linear-gradient(145deg, #81c784, #32cd32); }
.balloon[data-color="orange"] { background: linear-gradient(145deg, #ffb74d, #ffa500); }


.balloon:hover {
    transform: scale(1.1);
}

.balloon.vanish {
    background: none;
    border: none;          /* removes white outline */
    box-shadow: none;      /* removes shadow */
    animation: none;
    transform: scale(1);
    opacity: 0;            /* fades out balloon */
    transition: opacity 0.3s ease;
}

/* Hide shine and string */
.balloon.vanish::before,
.balloon.vanish::after {
    display: none;
}

/* Keep text visible after vanish */
.balloon.vanish::after,
.balloon.vanish::before {
    display: none;
}

.balloon.vanish span {
    opacity: 1;
    color: white;
}



@keyframes floatBalloon {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(4deg); }
}

@media (max-width: 700px) {
    body {
        background-attachment: scroll;
        background-position: center top;
    }

    .content {
        margin-top: 40px;
        padding: 0 12px;
    }

    .balloon-stage h2 {
        font-size: 28px;
        margin-bottom: 16px;
    }

    .balloon-field {
        height: 320px;
        gap: 12px 10px;
        margin-top: 24px;
    }

    .balloon {
        width: 64px;
        height: 82px;
        font-size: 14px;
        margin: 6px;
    }

    .camera-btn {
        margin-top: 24px;
    }

    .camera-icon {
        width: 48px;
    }
}

.camera-btn {
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 40px;
}

.camera-icon {
    width: 60px;
    transition: transform 0.3s ease, filter 0.3s ease;
}

.camera-icon:hover {
    transform: scale(1.2) rotate(-5deg);
    filter: drop-shadow(0 0 12px #ff99ff);
}

.letter-btn {
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 40px;
}

.letter-icon {
    width: 60px;
    transition: transform 0.3s ease, filter 0.3s ease;
}

.letter-icon:hover {
    transform: scale(1.2) rotate(-5deg);
    filter: drop-shadow(0 0 12px #d5cadf);
}


    </style>
</head>
<body>
    
    <div class="content">
        <audio id="popSound" src="pop.mp3" preload="auto"></audio>
       
     <section id="step2" class="screen">
    <div class="balloon-stage">
        <h2>Pop the Balloons 🎈</h2>
        <div class="balloon-field" id="balloonField">
            <button class="balloon" data-word="You" data-color="pink"></button>
            <button class="balloon" data-word="are" data-color="blue"></button>
            <button class="balloon" data-word="very" data-color="yellow"></button>
            <button class="balloon" data-word="special" data-color="purple"></button>
            <button class="balloon" data-word="and" data-color="green"></button>
            <button class="balloon" data-word="beautiful" data-color="orange"></button>
        </div>
    </div>
</section>
    <div class="reveal-text"></div>
</div>
<button class="camera-btn" onclick="location.href='Moments_of_you.html'">
    <img src="https://cdn-icons-png.flaticon.com/512/1042/1042339.png" 
         alt="camera" class="camera-icon">
</button>


<button class="letter-btn" onclick="location.href='letters.html'">
    <img src="https://cdn-icons-png.flaticon.com/512/3463/3463549.png" 
         alt="letter" class="letter-icon">
</button>





    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    const balloonField = document.getElementById('balloonField');
    const balloons = document.querySelectorAll('.balloon');
    const popSound = document.getElementById('popSound');

    function startBalloonScene() {
        let poppedCount = 0;

        balloons.forEach((balloon) => {
            balloon.addEventListener('click', () => {
                if (balloon.classList.contains('vanish')) return;

                // Play pop sound
                popSound.currentTime = 0;
                popSound.play();

                // Replace balloon with word
                const word = balloon.getAttribute('data-word');
                balloon.classList.add('vanish');
balloon.style.color = "white";
balloon.style.opacity = "1";
balloon.textContent = word;

                poppedCount++;

                // 🎉 Confetti burst for each pop
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: {
                        x: (balloon.offsetLeft + balloon.offsetWidth / 2) / window.innerWidth,
                        y: (balloon.offsetTop + balloon.offsetHeight / 2) / window.innerHeight
                    }
                });

                // 🎊 When all balloons are gone
                if (poppedCount === balloons.length) {
                    setTimeout(() => {
                        confetti({
                            particleCount: 300,
                            spread: 120,
                            origin: { y: 0.6 }
                        });
                    }, 500);
                }
            });
        });
    }

    window.onload = startBalloonScene;
</script>


</body>

</html>
